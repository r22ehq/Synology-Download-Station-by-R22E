name: Bug Report
description: Create a report to help us improve Synology Download Station by R22E
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Security Warning
        **DO NOT** include any of the following in your report:
        - Your NAS password
        - Your SID or OTP
        - Browser cookies
        - Remembered-device tokens
        - NAS public credentials
        - Private tracker credentials
        
        If this is a security vulnerability, please email `hello@r22e.com` directly instead of opening a public issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How do we replicate the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser & Version
      placeholder: e.g. Chrome 120.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. macOS Sonoma
    validations:
      required: true
  - type: input
    id: dsm-version
    attributes:
      label: DSM Version
      placeholder: e.g. DSM 7.2.1
  - type: input
    id: download-station-version
    attributes:
      label: Download Station Version
      placeholder: (Optional)
  - type: textarea
    id: logs
    attributes:
      label: Sanitized Logs / Additional Context
      description: Provide any sanitized console logs or screenshots (if safe).
